version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - SPICE_KERNEL_DIR=/app/data/kernels
      - CORS_ORIGINS=["https://lunar-landing-site-navigator-jo55.onrender.com"]
    volumes:
      - ./backend:/app
      - ./data:/app/data
    command: >
      sh -c "python scripts/download_kernels.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  data: