<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="moonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8edf5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9ca8b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7a90;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Moon -->
  <circle cx="50" cy="50" r="45" fill="url(#moonGradient)" />
  <!-- Crater shadows -->
  <circle cx="35" cy="35" r="8" fill="#6b7a90" opacity="0.3" />
  <circle cx="70" cy="65" r="5" fill="#6b7a90" opacity="0.2" />
  <circle cx="25" cy="70" r="4" fill="#6b7a90" opacity="0.2" />
  <!-- Sun indicator -->
  <circle cx="80" cy="20" r="12" fill="url(#sunGradient)" />
  <circle cx="80" cy="20" r="6" fill="#fff8e7" opacity="0.8" />
  <!-- Landing site marker -->
  <circle cx="50" cy="55" r="3" fill="#00d4aa" />
  <circle cx="50" cy="55" r="6" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.6" />
</svg>